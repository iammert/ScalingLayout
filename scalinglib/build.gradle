apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group = 'com.github.iammert'
version = '1.3.0'

android {
    namespace 'iammert.com.view.scalinglib'
    compileSdk 33

    defaultConfig {
        minSdk 15
        targetSdk 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api 'androidx.core:core:1.7.0'
    api 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    api 'com.google.android.material:material:1.5.0'

    testImplementation 'junit:junit:4.13.2'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.iammert'
                artifactId = 'ScalingLayout'
                version = project.version

                pom {
                    name = 'ScalingLayout'
                    description = 'Scale your layout on user interaction.'
                    url = 'https://github.com/iammert/ScalingLayout'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
    }
}
