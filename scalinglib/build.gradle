plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

group = 'com.github.iammert'
version = '2.1.1'

android {
    namespace = 'iammert.com.view.scalinglib'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles('consumer-rules.pro')
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api libs.androidx.core
    api libs.androidx.coordinatorlayout
    api libs.material

    testImplementation libs.junit
    testImplementation libs.robolectric
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.iammert'
                artifactId = 'ScalingLayout'
                version = project.version

                pom {
                    name = 'ScalingLayout'
                    description = 'Scale your layout on user interaction.'
                    url = 'https://github.com/iammert/ScalingLayout'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
    }
}
